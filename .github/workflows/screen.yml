name: screen

# Wide niche screen: 144 niches, EU tenders (TED), GitHub, Wikipedia. No OpenAlex credits.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.1.3
      - name: Screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m mashina.screen
      - name: Commit report
        if: always()
        run: |
          git config user.name "mashina-bot"
          git config user.email "mashina-bot@users.noreply.github.com"
          git add reports/screen.*
          git diff --cached --quiet || git commit -m "screen: $(date -u +%F)"
          git pull --rebase origin main
          git push
