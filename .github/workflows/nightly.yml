name: nightly

# 00:40 UTC = 01:40 Copenhagen, right after the OpenAlex daily credits reset at 00:00 UTC.
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.1.3 pytest==8.3.3
      - run: python -m pytest -q tests
      - name: Collect and evaluate
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
        run: python -m mashina nightly --areas 500 --max-credits 9500
      - name: Commit data
        if: always()
        run: |
          git config user.name "mashina-bot"
          git config user.email "mashina-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "nightly: $(date -u +%F)"
          git push
