name: blindspots

# One-off measurement of what OpenAlex covers (about 12 credits). Manual only:
# run it late in the UTC day, never before the nightly run.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Measure
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
        run: python -m mashina.blindspots
      - name: Commit report
        if: always()
        run: |
          git config user.name "mashina-bot"
          git config user.email "mashina-bot@users.noreply.github.com"
          git add reports/blindspots.*
          git diff --cached --quiet || git commit -m "blindspots: $(date -u +%F)"
          git pull --rebase origin main
          git push
