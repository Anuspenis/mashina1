name: commercial_map

# One-off: share of company-authored works for every subfield and topic (about 180 credits).
# Manual only, late in the UTC day, after the nightly run has finished.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Map
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
        run: python -m mashina.commercial_map
      - name: Commit report
        if: always()
        run: |
          git config user.name "mashina-bot"
          git config user.email "mashina-bot@users.noreply.github.com"
          git add reports/commercial_map.*
          git diff --cached --quiet || git commit -m "commercial map: $(date -u +%F)"
          git pull --rebase origin main
          git push
